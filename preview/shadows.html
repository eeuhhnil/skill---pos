<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;color:var(--ink)}
  .wrap{padding:30px 24px;display:flex;gap:34px;align-items:center}
  .card{width:150px;height:80px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font:var(--caption);color:var(--text-secondary)}
  .l{font:var(--caption);color:var(--text-secondary);text-align:center;margin-top:14px}
  .l b{color:var(--ink)}
</style></head>
<body><div class="wrap">
  <div><div class="card" style="box-shadow:var(--shadow-sm)">sm</div><div class="l"><b>shadow-sm</b><br>0 1 2 · 8%<br>chips, hover</div></div>
  <div><div class="card" style="box-shadow:var(--shadow-md)">md</div><div class="l"><b>shadow-md</b><br>0 4 12 · 15%<br>cards, popovers</div></div>
  <div><div class="card" style="box-shadow:var(--shadow-lg)">lg</div><div class="l"><b>shadow-lg</b><br>0 12 32 · 16%<br>modals</div></div>
</div>
</body></html>
