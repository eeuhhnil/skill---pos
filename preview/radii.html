<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;color:var(--ink)}
  .wrap{padding:22px 24px;display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
  .item{text-align:center}
  .box{background:var(--blue-100);border:1px solid var(--blue-200);border-radius:0}
  .lab{font:var(--caption);color:var(--text-secondary);margin-top:8px}
  .lab b{display:block;color:var(--ink);font-size:13px}
  .tag{font:var(--caption);color:var(--text-secondary);width:100%}
</style></head>
<body><div class="wrap">
  <div class="tag" style="margin-bottom:4px">Corner radius scale</div>
  <div class="item"><div class="box" style="width:70px;height:54px;border-radius:4px"></div><div class="lab"><b>4</b>xs · keycaps</div></div>
  <div class="item"><div class="box" style="width:70px;height:54px;border-radius:6px"></div><div class="lab"><b>6</b>sm · inputs, chips</div></div>
  <div class="item"><div class="box" style="width:70px;height:54px;border-radius:8px"></div><div class="lab"><b>8</b>md · buttons</div></div>
  <div class="item"><div class="box" style="width:70px;height:54px;border-radius:12px"></div><div class="lab"><b>12</b>lg · popovers</div></div>
  <div class="item"><div class="box" style="width:70px;height:54px;border-radius:16px"></div><div class="lab"><b>16</b>xl · cards/panels</div></div>
  <div class="item"><div class="box" style="width:70px;height:54px;border-radius:999px"></div><div class="lab"><b>full</b>pills, avatars</div></div>
</div>
</body></html>
