<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;color:var(--ink)}
  .wrap{padding:20px;display:flex;gap:22px;align-items:center}
  .item{flex:1;text-align:center;background:var(--surface-page);border-radius:14px;padding:18px}
  .item img{height:120px;object-fit:contain}
  .cap{font:var(--caption);color:var(--text-secondary);margin-top:8px}
  .cap b{display:block;color:var(--ink);font-size:13px}
</style></head>
<body><div class="wrap">
  <div class="item"><img src="../assets/illustration-maintenance.png" alt="maintenance"><div class="cap"><b>System maintenance</b>Spot illustration — friendly 3D style</div></div>
  <div class="item"><img src="../assets/illustration-notification.png" alt="notification"><div class="cap"><b>Notification</b>Used in announcement / alert screens</div></div>
</div>
</body></html>
