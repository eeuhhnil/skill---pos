<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;color:var(--ink)}
  .wrap{padding:22px 24px;display:flex;gap:40px;align-items:center}
  .tag{font:var(--caption);color:var(--text-secondary);margin-bottom:8px}
  .big{font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue-500);font-size:40px;letter-spacing:-0.01em}
  .mid{font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;font-size:22px}
  .strike{color:var(--text-placeholder);text-decoration:line-through;font-size:15px;font-weight:500}
  .col{flex:1}
  table{border-collapse:collapse;font-family:var(--font-num);font-variant-numeric:tabular-nums}
  td{padding:3px 14px 3px 0;text-align:right;font-weight:700;font-size:15px}
  td.l{text-align:left;font-family:var(--font-sans);font-weight:400;color:var(--text-secondary);font-size:13px}
</style></head>
<body><div class="wrap">
  <div class="col">
    <div class="tag">Money total — SF&nbsp;Display / system Bold, tabular</div>
    <div class="big">5.000.000đ</div>
    <div style="margin-top:8px"><span class="strike">35.000</span> &nbsp;<span class="mid" style="color:var(--ink)">30.000đ</span></div>
  </div>
  <div class="col">
    <div class="tag">Tabular alignment in tables</div>
    <table>
      <tr><td class="l">Đơn giá</td><td>339.000</td></tr>
      <tr><td class="l">Giảm giá</td><td>0</td></tr>
      <tr><td class="l">Thành tiền</td><td style="color:var(--blue-500)">339.000</td></tr>
    </table>
  </div>
</div>
</body></html>
