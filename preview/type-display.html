<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;color:var(--ink)}
  .wrap{padding:22px 24px}
  .row{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid var(--border-faint)}
  .row:last-child{border:0}
  .meta{font:var(--caption);color:var(--text-secondary);white-space:nowrap;width:120px;flex:none}
  .spec{font-family:var(--font-display);color:var(--ink);line-height:1.15}
  .tag{font:var(--caption);color:var(--text-secondary)}
</style></head>
<body><div class="wrap">
  <div class="tag" style="margin-bottom:10px">Display / Headings — <b style="color:var(--ink)">Be Vietnam Pro</b> Semibold · used for titles &amp; brand</div>
  <div class="row"><div class="meta">H1 · 64 / 120%</div><div class="spec" style="font-size:46px;font-weight:600">Bán hàng dễ dàng</div></div>
  <div class="row"><div class="meta">H2 · 48 / 150%</div><div class="spec" style="font-size:38px;font-weight:600">Xuất hóa đơn</div></div>
  <div class="row"><div class="meta">H4 · 36 / 150%</div><div class="spec" style="font-size:30px;font-weight:600">Kê khai thuế</div></div>
  <div class="row"><div class="meta">H6 · 20 / 150%</div><div class="spec" style="font-size:20px;font-weight:600">Quản lý cửa hàng toàn diện</div></div>
</div>
</body></html>
