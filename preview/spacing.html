<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;color:var(--ink)}
  .wrap{padding:22px 24px}
  .tag{font:var(--caption);color:var(--text-secondary);margin-bottom:14px}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:9px}
  .bar{background:var(--blue-500);height:16px;border-radius:3px}
  .n{font-family:var(--font-num);font-weight:700;width:34px;font-size:13px}
  .u{font:var(--caption);color:var(--text-secondary)}
</style></head>
<body><div class="wrap">
  <div class="tag">Spacing scale — 4px base · used for gaps, padding, layout rhythm</div>
  <div class="row"><div class="n">4</div><div class="bar" style="width:4px"></div><div class="u">space-1 · icon ↔ label, tight</div></div>
  <div class="row"><div class="n">8</div><div class="bar" style="width:8px"></div><div class="u">space-2 · button gap, chip padding</div></div>
  <div class="row"><div class="n">12</div><div class="bar" style="width:12px"></div><div class="u">space-3 · list-item gaps</div></div>
  <div class="row"><div class="n">16</div><div class="bar" style="width:16px"></div><div class="u">space-4 · card padding, default gap</div></div>
  <div class="row"><div class="n">24</div><div class="bar" style="width:24px"></div><div class="u">space-5 · section gap</div></div>
  <div class="row"><div class="n">32</div><div class="bar" style="width:32px"></div><div class="u">space-6 · block spacing</div></div>
  <div class="row"><div class="n">64</div><div class="bar" style="width:64px"></div><div class="u">space-8 · page / layout padding</div></div>
</div>
</body></html>
