<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-page);color:var(--ink)}
  .wrap{padding:20px}
  .total{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 16px;margin-bottom:12px}
  .total .l{font:var(--body-lg);color:var(--text-secondary)}
  .total .r{display:flex;align-items:center;gap:8px}
  .total .amt{font-family:var(--font-num);font-weight:700;font-size:24px;color:var(--blue-500);letter-spacing:-.01em}
  .total svg{width:20px;height:20px;color:var(--blue-500)}
  .bar{display:flex;gap:16px}
  .b{display:flex;align-items:center;justify-content:center;gap:10px;height:60px;border-radius:6px;font-weight:700;font-size:20px}
  .save{flex:0 0 268px;background:var(--blue-100);border:1px solid var(--blue-500);color:var(--blue-500)}
  .pay{flex:1;background:var(--blue-500);color:#fff}
  .key{font-size:16px;font-weight:700;border-radius:4px;padding:2px 6px}
  .save .key{background:var(--blue-200);color:var(--blue-700)}
  .pay .key{background:rgba(255,255,255,.22);color:#fff}
</style></head>
<body><div class="wrap">
  <div class="total"><span class="l">Tổng tiền hàng (4)</span>
    <span class="r"><span class="amt">5.000.000đ</span><i data-lucide="chevron-right-circle"></i></span></div>
  <div class="bar">
    <button class="b save">Lưu đơn <span class="key">F9</span></button>
    <button class="b pay">Thanh toán <span class="key">F9</span></button>
  </div>
</div>
<script>lucide.createIcons();</script>
</body></html>
