<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;color:var(--ink)}
  .wrap{padding:20px;display:flex;gap:18px;align-items:stretch}
  .card{flex:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:22px;border:1px solid var(--border-faint)}
  .onblue{background:var(--blue-500)}
  .lock{display:flex;align-items:center;gap:9px}
  .mark{width:34px;height:34px;display:inline-flex}
  .mark svg{width:100%;height:100%}
  .word{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.01em}
  .cap{font:var(--caption);color:var(--text-secondary)}
  .onblue .cap{color:rgba(255,255,255,.7)}
</style></head>
<body><div class="wrap">
  <div class="card onblue">
    <div class="lock" style="color:#fff"><span class="mark" id="m1"></span><span class="word" style="color:#fff">EasyPOS</span></div>
    <div class="cap">Primary — white on brand blue</div>
  </div>
  <div class="card">
    <div class="lock" style="color:var(--blue-500)"><span class="mark" id="m2"></span><span class="word" style="color:var(--blue-500)">EasyPOS</span></div>
    <div class="cap">On light surfaces</div>
  </div>
</div>
<script>
fetch('../assets/easypos-mark.svg').then(r=>r.text()).then(s=>{document.getElementById('m1').innerHTML=s;document.getElementById('m2').innerHTML=s;});
</script>
</body></html>
